services:
  mailer:
    build:
      context: .
      dockerfile: Dockerfile.mailer
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.yandex.ru}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-hello@aspect-it.ru}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-sorvall@mail.ru}
    restart: unless-stopped
    expose:
      - "8080"

  web:
    build: .
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-aspect-it.ru}
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - mailer
    restart: unless-stopped

  # One-off: docker compose run --rm certbot certonly ...
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles:
      - certbot
    entrypoint: ["certbot"]

volumes:
  certbot-etc:
  certbot-www:
