# Деплой на VPS: архив кода → SCP → распаковка → docker compose (nginx, статический сайт).
#
# Секреты GitHub (Settings → Secrets and variables → Actions):
#   SERVER_HOST     — IP или домен сервера
#   SERVER_USER     — пользователь SSH (например root или deploy)
#   SSH_PASSWORD    — пароль SSH (или SSH-ключ — см. appleboy docs)
#   DEPLOY_PATH     — каталог на сервере, например /root/aspect-it
#
# Опционально:
#   SSH_PORT        — порт SSH, если не 22
#   CERTBOT_EMAIL   — email для Let's Encrypt (уведомления об истечении сертификата)
#   SMTP_PASSWORD   — пароль приложения Яндекс.Почты для sorvallsorokin@yandex.ru
#                     (не пароль Mail.ru: с VPS smtp.mail.ru недоступен)
#   SMTP_USER       — ящик SMTP, по умолчанию sorvallsorokin@yandex.ru
#   MAIL_TO         — куда слать заявки, по умолчанию sorvall@mail.ru
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN — не обязательны; базовый образ тянется с AWS Public ECR
#
# На сервере один раз: установлены Docker и docker compose plugin.
# HTTPS: порты 80 и 443 должны быть свободны и открыты в firewall.
# Файл .env на сервере создаётся автоматически при деплое.

name: Build and Deploy Aspect IT

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_PORT_DEPLOY: ${{ secrets.SSH_PORT }}

    steps:
      - name: Verify deployment secrets
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_USER }}" ] || \
             [ -z "${{ secrets.SSH_PASSWORD }}" ] || [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "::error::Задайте секреты репозитория: SERVER_HOST, SERVER_USER, SSH_PASSWORD, DEPLOY_PATH"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write mailer env
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 << 'PY'
          import os
          from pathlib import Path

          def val(name, default=""):
              return (os.environ.get(name) or "").replace("\r", "").replace("\n", "").strip() or default

          def env_line(key, value):
              return "%s='%s'" % (key, value.replace("'", "'\"'\"'"))

          password = val("SMTP_PASSWORD")
          if not password:
              raise SystemExit("Задайте секрет SMTP_PASSWORD: пароль приложения Яндекс.Почты для sorvallsorokin@yandex.ru")

          user = val("SMTP_USER", "sorvallsorokin@yandex.ru")
          mail_to = val("MAIL_TO", "sorvall@mail.ru")
          Path("mailer.env").write_text(
              "\n".join([
                  env_line("SMTP_HOST", "smtp.yandex.ru"),
                  env_line("SMTP_PORT", "465"),
                  env_line("SMTP_USER", user),
                  env_line("MAIL_TO", mail_to),
                  env_line("SMTP_PASSWORD", password),
              ]) + "\n",
              encoding="utf-8",
          )
          print("mailer.env written; password_len=%s user=%s to=%s" % (len(password), user, mail_to))
          PY

      - name: SMTP check from GitHub
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: smtp.yandex.ru
          SMTP_PORT: "465"
        run: |
          python3 mailer/server.py check || echo "::warning::SMTP check failed from GitHub runner"

      - name: Create deployment archive
        run: |
          set -euo pipefail
          ARCHIVE_PATH="/tmp/aspect-it-deploy-${GITHUB_RUN_ID}.tgz"
          tar --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            -czf "${ARCHIVE_PATH}" .
          mv "${ARCHIVE_PATH}" aspect-it-deploy.tgz

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT_DEPLOY != '' && env.SSH_PORT_DEPLOY || 22 }}
          script: mkdir -p '${{ secrets.DEPLOY_PATH }}'

      - name: Copy archive to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT_DEPLOY != '' && env.SSH_PORT_DEPLOY || 22 }}
          source: "aspect-it-deploy.tgz"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Extract and run Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT_DEPLOY != '' && env.SSH_PORT_DEPLOY || 22 }}
          command_timeout: 30m
          debug: true
          script: |
            set -eo pipefail
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            test -n "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            find . -mindepth 1 -maxdepth 1 \
              ! -name 'aspect-it-deploy.tgz' \
              -exec rm -rf {} +
            tar xzf aspect-it-deploy.tgz
            rm -f aspect-it-deploy.tgz

            echo "=== Deploy directory ==="
            ls -la

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing via get.docker.com..."
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL https://get.docker.com | sh
              elif command -v wget >/dev/null 2>&1; then
                wget -qO- https://get.docker.com | sh
              else
                echo "::error::Neither curl nor wget is available to install Docker."
                exit 1
              fi
            fi

            echo "Starting Docker daemon..."
            if command -v systemctl >/dev/null 2>&1; then
              systemctl enable docker || true
              systemctl start docker || true
            elif command -v service >/dev/null 2>&1; then
              service docker start || true
            fi

            echo "Waiting for Docker..."
            ready=0
            for i in $(seq 1 15); do
              if docker info >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::Docker daemon is not running. Try on server: systemctl start docker"
              docker info || true
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Docker Compose plugin not found, installing..."
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq && apt-get install -y -qq docker-compose-plugin || true
              fi
              if docker compose version >/dev/null 2>&1; then
                COMPOSE_CMD="docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_CMD="docker-compose"
              else
                echo "::error::Docker Compose is not available on server."
                exit 1
              fi
            fi

            echo "Using: $COMPOSE_CMD"
            $COMPOSE_CMD version

            echo "=== Stopping previous containers ==="
            set +e
            $COMPOSE_CMD down --remove-orphans
            down_status=$?
            set -e
            if [ "$down_status" -ne 0 ]; then
              echo "No previous compose stack to stop (exit $down_status)"
            fi

            HTTP_PORT=80
            HTTPS_PORT=443
            DOMAIN=aspect-it.ru

            port_in_use() {
              _p="$1"
              if ss -tln 2>/dev/null | grep -qE ":${_p}[[:space:]]"; then
                return 0
              fi
              if netstat -tln 2>/dev/null | grep -qE ":${_p}[[:space:]]"; then
                return 0
              fi
              return 1
            }

            if port_in_use 80; then
              echo "::error::Port 80 is busy. Let's Encrypt and HTTPS require port 80 to be free."
              ss -tln 2>/dev/null | grep ':80 ' || netstat -tln 2>/dev/null | grep ':80 ' || true
              exit 1
            fi
            if port_in_use 443; then
              echo "::error::Port 443 is busy. HTTPS requires port 443 to be free."
              ss -tln 2>/dev/null | grep ':443 ' || netstat -tln 2>/dev/null | grep ':443 ' || true
              exit 1
            fi
            echo "Ports 80 and 443 are free — enabling HTTP + HTTPS"
            printf 'HTTP_PORT=%s\nHTTPS_PORT=%s\nDOMAIN=%s\n' "$HTTP_PORT" "$HTTPS_PORT" "$DOMAIN" > .env
            echo "=== .env ==="
            cat .env
            if [ ! -f mailer.env ]; then
              echo "::error::mailer.env missing from deploy archive"
              exit 1
            fi

            NGINX_IMAGE="public.ecr.aws/docker/library/nginx:alpine"
            PYTHON_IMAGE="public.ecr.aws/docker/library/python:3.12-alpine"

            echo "=== Ensuring base image ==="
            if docker image inspect "$NGINX_IMAGE" >/dev/null 2>&1; then
              echo "Using cached $NGINX_IMAGE on server."
            else
              pull_ok=0
              for attempt in 1 2 3 4 5; do
                echo "Pull attempt ${attempt}/5: $NGINX_IMAGE"
                if docker pull "$NGINX_IMAGE"; then
                  pull_ok=1
                  break
                fi
                sleep $((attempt * 15))
              done
              if [ "$pull_ok" -ne 1 ]; then
                echo "::error::Failed to pull base image from AWS Public ECR."
                echo "Run on server: docker pull $NGINX_IMAGE"
                exit 1
              fi
            fi

            echo "=== Ensuring Python image ==="
            if docker image inspect "$PYTHON_IMAGE" >/dev/null 2>&1; then
              echo "Using cached $PYTHON_IMAGE on server."
            else
              py_ok=0
              for attempt in 1 2 3 4 5; do
                echo "Pull attempt ${attempt}/5: $PYTHON_IMAGE"
                if docker pull "$PYTHON_IMAGE"; then
                  py_ok=1
                  break
                fi
                sleep $((attempt * 15))
              done
              if [ "$py_ok" -ne 1 ]; then
                echo "::error::Failed to pull Python image from AWS Public ECR."
                echo "Run on server: docker pull $PYTHON_IMAGE"
                exit 1
              fi
            fi

            echo "=== Ensuring certbot image ==="
            CERTBOT_IMAGE="certbot/certbot:latest"
            if ! docker image inspect "$CERTBOT_IMAGE" >/dev/null 2>&1; then
              docker pull "$CERTBOT_IMAGE"
            fi

            echo "=== Building ==="
            $COMPOSE_CMD build --progress=plain

            echo "=== Starting containers ==="
            set +e
            $COMPOSE_CMD up -d
            up_status=$?
            set -e

            if [ "$up_status" -ne 0 ]; then
              echo "::error::docker compose up failed with exit code $up_status"
              $COMPOSE_CMD ps -a || true
              $COMPOSE_CMD logs --no-color || true
              docker ps -a || true
              exit 1
            fi

            echo "=== Deploy OK ==="
            $COMPOSE_CMD ps

            echo "=== SMTP check ==="
            set +e
            $COMPOSE_CMD exec -T mailer python -u /app/server.py check
            smtp_status=$?
            set -e
            if [ "$smtp_status" -ne 0 ]; then
              echo "::warning::SMTP login failed. SMTP_PASSWORD must be a Yandex app password for sorvallsorokin@yandex.ru"
              $COMPOSE_CMD logs --no-color --tail 40 mailer || true
            fi

            echo "=== Let's Encrypt ==="
            CERTBOT_EMAIL='${{ secrets.CERTBOT_EMAIL }}'
            if [ -z "$CERTBOT_EMAIL" ]; then
              CERTBOT_EMAIL="admin@aspect-it.ru"
            fi
            CERT_FILE="/etc/letsencrypt/live/${DOMAIN}/fullchain.pem"

            if ! $COMPOSE_CMD exec -T web sh -c "test -f ${CERT_FILE}" 2>/dev/null; then
              echo "Requesting certificate for ${DOMAIN} and www.${DOMAIN}..."
              set +e
              $COMPOSE_CMD --profile certbot run --rm certbot certonly \
                --webroot -w /var/www/certbot \
                -d "${DOMAIN}" -d "www.${DOMAIN}" \
                --email "$CERTBOT_EMAIL" \
                --agree-tos --no-eff-email \
                --non-interactive
              cert_status=$?
              set -e
              if [ "$cert_status" -ne 0 ]; then
                echo "::warning::Certbot failed. Check DNS (A for ${DOMAIN} and www), firewall (80/443), and email."
                echo "Site remains on HTTP until certificate is issued."
              else
                echo "Certificate obtained — restarting web with HTTPS"
                $COMPOSE_CMD restart web
              fi
            else
              echo "Certificate already present — ensuring HTTPS config is active"
              $COMPOSE_CMD restart web
            fi

            CRON_MARKER="aspect-it-certbot-renew"
            CRON_CMD="0 4 * * * cd ${DEPLOY_PATH} && ${COMPOSE_CMD} --profile certbot run --rm certbot renew --webroot -w /var/www/certbot --quiet && ${COMPOSE_CMD} restart web >> /var/log/${CRON_MARKER}.log 2>&1"
            ( crontab -l 2>/dev/null | grep -v "$CRON_MARKER" || true
              echo "# ${CRON_MARKER}"
              echo "$CRON_CMD"
            ) | crontab - 2>/dev/null || echo "Could not install crontab for cert renewal"

            echo "Site: https://${DOMAIN}/"
            echo "HTTP redirects to HTTPS when certificate is active."
