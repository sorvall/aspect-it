server {
    listen 80;
    server_name aspect-it.ru www.aspect-it.ru _;
    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
    }

    location = /api/lead {
        proxy_pass http://unix:/tmp/aspect-mailer/mailer.sock:/lead;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8k;
        proxy_read_timeout 40s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        etag on;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;
}
